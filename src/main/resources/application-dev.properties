# Perfil de desarrollo: PostgreSQL en Docker (compose.yaml) y API ejecutada desde IntelliJ / Gradle.
# Las credenciales se leen de variables de entorno o, en su defecto, del archivo local .env
# (no versionado) ubicado en la raiz del proyecto. Las variables de entorno tienen prioridad.

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:polimarket_db}
spring.datasource.username=${POSTGRES_USER:polimarket}
spring.datasource.password=${POSTGRES_PASSWORD}

# La API solo escucha en la interfaz local.
server.address=127.0.0.1

# Sin JWT_PRIVATE_KEY_LOCATION / JWT_PUBLIC_KEY_LOCATION se genera un par RSA efimero
# (los tokens dejan de ser validos al reiniciar la API).
polimarket.jwt.ephemeral-keys-allowed=true

# Ademas de las migraciones, en dev Flyway carga los datos semilla (db/seed/R__datos_semilla.sql).
# Prod y las pruebas automatizadas no los incluyen.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-components=always

logging.level.com.polimarket.api=DEBUG