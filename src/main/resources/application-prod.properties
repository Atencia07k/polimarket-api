# Perfil de produccion: todos los valores sensibles se proporcionan mediante variables de entorno.
# Variables requeridas: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_PRIVATE_KEY_LOCATION, JWT_PUBLIC_KEY_LOCATION
# (las llaves JWT son obligatorias: la API no arranca sin ellas).

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}

management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

logging.level.root=WARN
logging.level.com.polimarket.api=INFO