# Configuracion comun a todos los perfiles.
# Activa un perfil explicitamente: dev | test | prod

spring.application.name=polimarket-api
spring.main.banner-mode=console

# Servidor y gestion de errores
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=true

# JSON
spring.jackson.default-property-inclusion=non_null

# DataSource / HikariCP
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=PolimarketHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate (el dialecto PostgreSQL se detecta automaticamente)
spring.jpa.open-in-view=false
# Sin generacion automatica de tablas; el esquema se gestionara con migraciones controladas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.transaction.default-timeout=30s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Logs (SLF4J)
logging.level.root=INFO
logging.level.com.polimarket.api=INFO