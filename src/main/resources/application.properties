# Configuracion comun a todos los perfiles.
# Activa un perfil explicitamente: dev | test | prod

spring.application.name=polimarket-api
spring.main.banner-mode=console

# Servidor y gestion de errores
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=true

# JSON
spring.jackson.default-property-inclusion=non_null

# DataSource / HikariCP
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=PolimarketHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate (el dialecto PostgreSQL se detecta automaticamente)
spring.jpa.open-in-view=false
# El esquema lo crea Flyway (db/migration); Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.transaction.default-timeout=30s

# Flyway: una base existente sin historial (tablas creadas antes de Flyway) se marca como version 1
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Seguridad JWT (RS256). Las llaves PEM se configuran por perfil o variables de entorno.
polimarket.jwt.issuer=polimarket-api
polimarket.jwt.audience=polimarket-api
polimarket.jwt.access-token-ttl=15m
polimarket.jwt.refresh-token-ttl=7d
polimarket.jwt.clock-skew=30s
polimarket.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
polimarket.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}

# Primer administrador: se crea al arrancar solo si no existe ningun ADMIN y ambas variables estan definidas
polimarket.seguridad.admin-inicial.username=${ADMIN_USERNAME:}
polimarket.seguridad.admin-inicial.password=${ADMIN_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Logs (SLF4J)
logging.level.root=INFO
logging.level.com.polimarket.api=INFO