plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.polimarket'
version = '0.1.0'
description = 'PoliMarket API - Reutilizacion de software por componentes'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    // Versiones administradas por el BOM de Spring Boot 4.1.2
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Migraciones versionadas del esquema (db/migration)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // spring-boot-starter-webmvc-test incluye spring-boot-starter-test (JUnit Jupiter, Mockito, AssertJ)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // Pruebas de repositorios: @DataJpaTest contra PostgreSQL efimero en Testcontainers
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// Mockito como agente Java explicito (recomendado por Mockito 5 en JDK 21+)
tasks.withType(Test).configureEach {
    jvmArgumentProviders.add({ ["-javaagent:${configurations.mockitoAgent.singleFile}"] } as CommandLineArgumentProvider)
    // Evita la advertencia de CDS al ampliar Mockito el bootstrap classpath
    jvmArgs '-Xshare:off'
}

// Pruebas unitarias: no requieren PostgreSQL ni Docker
tasks.named('test') {
    description = 'Ejecuta las pruebas unitarias (sin base de datos).'
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Pruebas de integracion: requieren el contenedor PostgreSQL en ejecucion
tasks.register('integrationTest', Test) {
    description = 'Ejecuta las pruebas de integracion contra PostgreSQL en Docker.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}